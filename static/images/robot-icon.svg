<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo con color del tema -->
  <rect width="100" height="100" fill="#667eea" rx="15"/>
  <!-- Cabeza del robot -->
  <rect x="30" y="20" width="40" height="35" fill="white" rx="5"/>
  <!-- Ojos del robot -->
  <circle cx="42" cy="32" r="4" fill="#667eea"/>
  <circle cx="58" cy="32" r="4" fill="#667eea"/>
  <!-- Antena -->
  <rect x="47" y="15" width="6" height="8" fill="white" rx="2"/>
  <circle cx="50" cy="12" r="3" fill="#ffd700"/>
  <!-- Cuerpo del robot -->
  <rect x="25" y="55" width="50" height="35" fill="white" rx="5"/>
  <!-- Botones del robot -->
  <circle cx="40" cy="68" r="3" fill="#667eea"/>
  <circle cx="50" cy="68" r="3" fill="#667eea"/>
  <circle cx="60" cy="68" r="3" fill="#667eea"/>
</svg>

